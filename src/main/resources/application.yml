spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/library?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8"
    username: library_user
    password: library
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false # dev: sửa template không cần restart
  web:
    resources:
      chain:
        cache: false # dev: CSS đổi là thấy ngay — bắt buộc cho screenshot loop
server:
  port: 8080 # plant_manager đang ở 8091. Không đụng nhau.
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # published_year -> publishedYear
    default-statement-timeout: 5
logging:
  level:
    com.example.library.mapper: DEBUG
